  # ------------------------------------------------------------------ Evaluation and lab limits
  - id: TM-32
    zone: X
    title: The measurement shares code, transport or timing with the system under test
    status: partially-mitigated
    doc_anchors:
      - "Shared Transport/Mechanism Between Collector and Verifier Oracle"
      - "In-Window Soak Unavailability vs. End-to-End MTTR"
    controls:
      - {path: src/gateheal/oracle.py, symbol: IndependentLabOracle}
      - {path: src/gateheal/models.py, symbol: VerificationReport}
    tests:
      - tests/unit/test_wp6_oracle_and_stats.py::test_oracle_import_closure_is_only_transport
      - tests/unit/test_wp6_oracle_and_stats.py::test_oracle_source_imports_only_allowed_modules
      - tests/unit/test_wp6_oracle_and_stats.py::test_unavailability_is_integrated_from_the_timeline_not_the_controller_clock
      - tests/experiments/test_wp6_campaign_engine.py::test_wp6_engine_never_uses_the_removed_oracle_shortcut
    residual: >-
      The oracle has its own code path but queries the same systemctl, curl and TCP mechanisms over
      the same transport type, so a defect in that mechanism could affect controller and oracle
      alike (D5). Controller-side unavailability is an in-window upper bound; end-to-end MTTR comes
      only from the harness (D3).

  - id: TM-33
    zone: X
    title: The lab worker accepts an unauthenticated abort frame from any local process
    status: accepted-limitation
    doc_anchors:
      - "Unauthenticated Local Worker Abort Frame in Lab Daemon"
    controls:
      - {path: src/gateheal/lab_daemons.py, symbol: LabWorkerRuntimeState.handle_frame}
      - {path: src/gateheal/lab_daemons.py, symbol: notify_worker_of_api_hard_restart}
    tests:
      - tests/unit/test_wp4_t2_live_paths.py::test_t2_real_api_subprocess_sigterm_handler_notifies_and_stops_worker_subprocess
      - tests/integration/test_lab_services.py::test_lab_api_sighup_reload_vs_hard_restart_worker_coupling
    residual: >-
      This is a lab-only collateral-damage simulation hook, not a hardened IPC protocol. It exists
      to make S5 observable and must not be reused outside the disposable guest.

  - id: TM-34
    zone: X
    title: The S5 fault is a runtime flag, so results do not transfer to faults that survive a restart
    status: accepted-limitation
    doc_anchors:
      - "S5 Stale-Pool Fault Is Runtime-Only, Not Persisted"
    controls:
      - {path: lab/fault_injection/inject_fault.sh, contains: SIGUSR1}
      - {path: src/gateheal/lab_daemons.py, symbol: LabApiRuntimeState.mark_worker_pool_stale}
    tests:
      - tests/unit/test_wp5_live_findings.py::test_inject_s5_does_not_persist_fault_in_config_file
      - tests/unit/test_wp5_live_findings.py::test_runtime_stale_flag_is_cleared_by_restart_and_sighup
      - tests/unit/test_wp5_live_findings.py::test_real_api_daemon_sigusr1_degrades_then_restart_and_sighup_recover
    residual: >-
      S5 models a stale in-memory pool. A fault that survives restarts is modelled by S2 and S4
      (invalid configuration), which no arm can repair.

  - id: TM-35
    zone: X
    title: Live-lab evidence is over-claimed (one guest image, three repeats, emulated daemons)
    status: accepted-limitation
    doc_anchors:
      - "Live-Lab Validation Scope and Provenance"
      - "Real-Lab VM Execution"
    controls:
      - {path: src/gateheal/lab_bringup.py, symbol: conformance_is_complete_and_passed}
      - {path: src/gateheal/wp6_engine.py, symbol: validate_wp6_preflight}
    tests:
      - tests/unit/test_wp5_live_findings.py::test_conformance_missing_facts_are_not_all_passed
      - tests/unit/test_wp5_live_findings.py::test_manifest_conformance_not_all_passed_when_facts_truncated
      - tests/unit/test_wp5_live_findings.py::test_manifest_counts_mismatches_and_flakes_separately
      - tests/experiments/test_wp6_campaign_engine.py::test_wp6_preflight_checks_wp5_manifest_and_dirty_tree
    residual: >-
      Behaviour on other systemd versions, other images or real services is not established. The
      live-VM tests are skipped unless GATEHEAL_RUN_LAB_TESTS=1 and a guest is booted.
