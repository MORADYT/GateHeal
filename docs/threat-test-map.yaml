  - id: TM-29
    zone: Z4
    title: Verifier misses a crash after the restart, a flap, a late collateral failure or an uncertain probe
    status: partially-mitigated
    doc_anchors:
      - "Strict All-Samples-Healthy Soak Rule vs. Slow Startup Grace"
      - "Manual Restart Resets `NRestarts`"
    controls:
